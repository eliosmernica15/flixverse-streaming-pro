name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NEXT_PUBLIC_FIREBASE_API_KEY: test
  TMDB_ACCESS_TOKEN: test
  TMDB_API_KEY: test

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check public environment variables
        run: npm run check:public-env

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Strict type check (player sync libs)
        run: npm run typecheck:strict

      - name: Unit tests
        run: npm test

      - name: Firestore rules checks
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (basic)
        # Functional specs only. The emulator spec manages its own emulators in
        # the party-e2e-emulator job, and the visual spec targets win32 snapshots.
        run: npx playwright test e2e/home-and-sources.spec.ts e2e/party-sync.spec.ts --project=chromium

      - name: NPM Audit
        run: npm audit --audit-level=high

  webhook-idempotency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run webhook idempotency tests
        run: npm run test:webhook

  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Visual Regression Tests
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium
        continue-on-error: true

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Python Audit
        run: pip-audit

  strict-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Strict Type Check
        run: npx tsc --noEmit --strict

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate Firestore rules
        run: npm run test:rules